
title = "SentinelPay Gitleaks Configuration"

[extend]
useDefault = true

# =========================================================
# SentinelPay-specific secret detection rules
# =========================================================

# Rule 1: Hardcoded sensitive environment variables

[[rules]]
id = "sentinelpay-sensitive-env"
description = "Detect hardcoded SentinelPay sensitive environment variables"
regex = '''(?im)^[ \t]*(?:-[ \t]*)?(?:export[ \t]+)?(JWT_SECRET|POSTGRES_PASSWORD|PROD_DB_PASSWORD|PARTNER_API_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)[ \t]*[:=][ \t]*["']?([^ \t\r\n"'#${}][^\r\n"'#]*)'''
secretGroup = 2
keywords = [
  "jwt_secret",
  "postgres_password",
  "prod_db_password",
  "partner_api_key",
  "aws_access_key_id",
  "aws_secret_access_key"
]

# Rule 2: PostgreSQL URLs containing embedded passwords

[[rules]]
id = "sentinelpay-database-url"
description = "Detect PostgreSQL URLs containing embedded passwords"
regex = '''(?i)postgres(?:ql)?://[^:\s]+:([^@\s]+)@[^/\s]+/[^\s]+'''
secretGroup = 1
keywords = [
  "postgresql://",
  "postgres://",
  "database_url"
]

# Rule 3: Slack webhook URLs

[[rules]]
id = "sentinelpay-slack-webhook"
description = "Detect Slack webhook URLs"
regex = '''https://hooks\.slack\.com/services/[A-Za-z0-9/_-]+'''
keywords = [
  "hooks.slack.com",
  "slack_webhook"
]

# Rule 4: Hardcoded Terraform secrets

[[rules]]
id = "sentinelpay-terraform-secret"
description = "Detect hardcoded sensitive values in Terraform"
regex = '''(?i)(password|secret|token|api_key|access_key|secret_key)[ \t]*=[ \t]*["']([^"'\r\n${}]+)["']'''
secretGroup = 2
keywords = [
  "password",
  "secret",
  "token",
  "api_key",
  "access_key",
  "secret_key"
]
